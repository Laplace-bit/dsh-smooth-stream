# Applied when this package appears in a profile's dsh.profile.bundles list.
- insert:
    - id: smooth-stream
      name: dsh-smooth-stream
      config:
        mode: typewriter
        preset: balanced
        revealCharsPerSec: 80
        scrollSpeedPxPerSec: 48
        maxScrollSpeedPxPerSec: 1000
        # Harness 0.1.7+: leave bottom-follow to the kernel by default; set true to restore the engine.
        controlScroll: false
